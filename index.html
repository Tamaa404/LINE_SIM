<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='12' x='3' y='6' rx='2'/><path d='M9 18v3'/><path d='M15 18v3'/><path d='M12 2v4'/><circle cx='9' cy='12' r='1'/><circle cx='15' cy='12' r='1'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Line Follower Robot Simulator - Blockly & Dual Canvas</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN for instant styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#151e2e',
                950: '#090d16',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['Fira Code', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        background-color: #090d16;
        color: #f8fafc;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        height: 100%;
        width: 100%;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
      ::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(71, 85, 105, 1); }

      /* Blockly dark theme overrides */
      .blocklySvg { background-color: #0f172a !important; }
      .blocklyMainBackground { fill: #0f172a !important; stroke: none !important; }
      .blocklyToolboxDiv { background-color: #1e293b !important; border-right: 1px solid rgba(255, 255, 255, 0.1) !important; }
      .blocklyTreeLabel { font-family: 'Inter', sans-serif !important; font-size: 13px !important; color: #e2e8f0 !important; }
      .blocklyFlyoutBackground { fill: #1e293b !important; fill-opacity: 0.95 !important; }
      .blocklyScrollbarHandle { fill: #475569 !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
