<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='12' x='3' y='6' rx='2'/><path d='M9 18v3'/><path d='M15 18v3'/><path d='M12 2v4'/><circle cx='9' cy='12' r='1'/><circle cx='15' cy='12' r='1'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Line Follower Robot Simulator - Blockly & Dual Canvas</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    

    <style>
      html, body {
        background-color: #FFF8E7;
        color: #6C1A1A;
        font-family: 'Inter', sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: manipulation;
        height: 100%;
        width: 100%;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      html.dark, html.dark body {
        background-color: #090D16;
        color: #F8FAFC;
      }

      /* Custom scrollbars */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #F4E3BA; }
      ::-webkit-scrollbar-thumb { background: #31AAA9; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #A82020; }
      
      html.dark ::-webkit-scrollbar-track { background: #0F172A; }
      html.dark ::-webkit-scrollbar-thumb { background: #38BDF8; border-radius: 3px; }
      html.dark ::-webkit-scrollbar-thumb:hover { background: #0284C7; }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Blockly Warm Light Mode Theme Overrides */
      html:not(.dark) .blocklySvg { background-color: #FDF4DC !important; }
      html:not(.dark) .blocklyMainBackground { fill: #FDF4DC !important; stroke: none !important; }
      html:not(.dark) .blocklyToolboxDiv { background-color: #F5E5BE !important; border-right: 2px solid #E6CA85 !important; color: #6C1A1A !important; }
      html:not(.dark) .blocklyTreeLabel { font-family: 'Inter', sans-serif !important; font-size: 13px !important; color: #6C1A1A !important; font-weight: 700 !important; }
      html:not(.dark) .blocklyFlyoutBackground { fill: #F7E8C7 !important; fill-opacity: 0.98 !important; }
      html:not(.dark) .blocklyScrollbarHandle { fill: #31AAA9 !important; }
      html:not(.dark) .blocklyTreeRow.blocklyTreeSelected { background-color: #31AAA9 !important; }
      html:not(.dark) .blocklyTreeRow.blocklyTreeSelected .blocklyTreeLabel { color: #FFFFFF !important; }

      /* Blockly Sleek Dark Mode (Night Mode) Overrides */
      html.dark .blocklySvg { background-color: #0F172A !important; }
      html.dark .blocklyMainBackground { fill: #0F172A !important; stroke: none !important; }
      html.dark .blocklyToolboxDiv { background-color: #1E293B !important; border-right: 2px solid #334155 !important; color: #F8FAFC !important; }
      html.dark .blocklyTreeLabel { font-family: 'Inter', sans-serif !important; font-size: 13px !important; color: #E2E8F0 !important; font-weight: 600 !important; }
      html.dark .blocklyFlyoutBackground { fill: #1E293B !important; fill-opacity: 0.98 !important; }
      html.dark .blocklyScrollbarHandle { fill: #38BDF8 !important; }
      html.dark .blocklyTreeRow.blocklyTreeSelected { background-color: #0284C7 !important; }
      html.dark .blocklyTreeRow.blocklyTreeSelected .blocklyTreeLabel { color: #FFFFFF !important; }

      /* Ensure Blockly SVG Trashcan bin icon is visible and clear of mobile dock */
      .blocklyTrash { opacity: 0.95 !important; cursor: pointer !important; }
      @media (max-width: 1023px) {
        .blocklyTrash {
          transform: translate(calc(100% - 60px), calc(100% - 110px)) !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Vite Entry Point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
